<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS Bazar · Colegio Ekirayá</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --teal:#146455;
    --teal-dk:#0d453a;
    --sage:#E7EFE6;
    --gold:#E8B23D;
    --coral:#F0664B;
    --ink:#1c2b27;
    --paper:#FBF9F4;
    --line: rgba(20,100,85,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background: var(--sage);
    color: var(--ink);
    min-height:100vh;
  }
  .sans{ font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }

  header.top{
    background: var(--teal);
    color: var(--paper);
    padding: 18px 20px 14px;
    box-shadow: 0 2px 0 var(--gold);
  }
  header.top .toprow{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; }
  header.top .brand{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  header.top .brand h1{
    margin:0; font-size:1.5rem; letter-spacing:0.5px; font-weight:normal;
  }
  header.top .brand .eyebrow{
    font-family:-apple-system,Helvetica,Arial,sans-serif;
    font-size:0.68rem; text-transform:uppercase; letter-spacing:2px;
    color: var(--gold); opacity:0.95;
  }
  .session-badge{
    font-family:-apple-system,Helvetica,Arial,sans-serif;
    font-size:0.8rem; text-align:right; color:var(--paper);
  }
  .session-badge .who{ font-weight:bold; }
  .session-badge .rol{ opacity:0.85; font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; }
  .session-badge button{
    margin-top:4px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.35);
    color:var(--paper); padding:4px 10px; border-radius:3px; cursor:pointer; font-size:0.72rem;
  }
  nav.tabs{
    display:flex; gap:6px; margin-top:14px; flex-wrap:wrap;
    font-family:-apple-system,Helvetica,Arial,sans-serif;
  }
  nav.tabs button{
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--paper);
    padding: 8px 14px;
    border-radius: 3px 3px 0 0;
    cursor:pointer;
    font-size:0.85rem;
    letter-spacing:0.3px;
  }
  nav.tabs button.active{
    background: var(--paper);
    color: var(--teal-dk);
    border-color: var(--paper);
    font-weight:bold;
  }
  main{ max-width: 980px; margin: 0 auto; padding: 22px 18px 60px; }

  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px;
    margin-bottom: 18px;
  }
  .card h2{ margin-top:0; font-weight:normal; font-size:1.25rem; color:var(--teal-dk); }
  .card h2 .num{ color:var(--gold); font-style:italic; margin-right:6px; }

  label{ display:block; font-family:-apple-system,Helvetica,Arial,sans-serif; font-size:0.72rem; text-transform:uppercase; letter-spacing:1.2px; color:var(--teal-dk); margin-bottom:5px; }
  input[type=text], input[type=number], input[type=password], select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:-apple-system,Helvetica,Arial,sans-serif; font-size:0.95rem; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, button:focus{ outline: 2px solid var(--coral); outline-offset:1px; }

  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:150px; }

  .caja-choice{ display:flex; gap:10px; }
  .caja-choice label.opt{
    flex:1; text-align:center; padding:10px; border:1px solid var(--line); border-radius:4px;
    cursor:pointer; text-transform:none; letter-spacing:0; font-size:0.95rem; font-family:'Georgia',serif;
  }
  .caja-choice input{ display:none; }
  .caja-choice input:checked + label.opt{ background: var(--teal); color:#fff; border-color:var(--teal); font-weight:bold;}
  .caja-fija{
    display:inline-block; background:var(--teal); color:#fff; padding:8px 16px; border-radius:4px; font-weight:bold;
  }

  button.btn{
    font-family:-apple-system,Helvetica,Arial,sans-serif;
    background: var(--teal); color:#fff; border:none; padding:10px 18px;
    border-radius:4px; cursor:pointer; font-size:0.9rem; letter-spacing:0.3px;
  }
  button.btn:hover{ background: var(--teal-dk); }
  button.btn.gold{ background: var(--gold); color: var(--teal-dk); font-weight:bold; }
  button.btn.gold:hover{ background:#d19c2c; }
  button.btn.coral{ background: var(--coral); }
  button.btn.coral:hover{ background:#d84e34; }
  button.btn.ghost{ background:transparent; color:var(--teal-dk); border:1px solid var(--line); }
  button.btn:disabled{ opacity:0.45; cursor:not-allowed; }

  table.cart{ width:100%; border-collapse:collapse; margin-top:14px; font-family:-apple-system,Helvetica,Arial,sans-serif; font-size:0.88rem; }
  table.cart th{ text-align:left; border-bottom:2px solid var(--teal); padding:6px 8px; color:var(--teal-dk); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.8px; }
  table.cart td{ padding:7px 8px; border-bottom:1px solid var(--line); }
  table.cart tfoot td{ font-weight:bold; border-top:2px solid var(--teal); border-bottom:none; }
  .rm{ background:none; border:none; color:var(--coral); cursor:pointer; font-family:-apple-system,sans-serif; font-size:0.85rem; }

  /* Ticket */
  .ticket-wrap{ display:flex; justify-content:center; padding: 10px 0 4px; }
  .ticket{
    position:relative; width:100%; max-width:340px; background:#fff;
    border:1.5px dashed var(--teal); border-radius:4px; padding:26px 20px 22px; text-align:center;
  }
  .ticket::before, .ticket::after{
    content:""; position:absolute; top:50%; width:20px; height:20px; background:var(--sage);
    border-radius:50%; transform:translateY(-50%);
  }
  .ticket::before{ left:-11px; }
  .ticket::after{ right:-11px; }
  .ticket .eyebrow{ font-family:-apple-system,sans-serif; font-size:0.65rem; letter-spacing:2px; text-transform:uppercase; color:var(--teal); }
  .ticket .code{ font-size:3.4rem; color:var(--coral); font-weight:bold; line-height:1.1; margin:6px 0; font-family:'Georgia',serif; }
  .ticket .meta{ font-family:-apple-system,sans-serif; font-size:0.82rem; color:var(--ink); opacity:0.85; }
  .ticket hr{ border:none; border-top:1px dashed var(--line); margin:14px 0; }
  .ticket .items{ text-align:left; font-family:-apple-system,sans-serif; font-size:0.85rem; }
  .ticket .items div{ display:flex; justify-content:space-between; padding:2px 0; }

  /* Despacho */
  .grid-cards{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
  .pedido-card{
    background:#fff; border:1px solid var(--line); border-left:6px solid var(--gold); border-radius:5px; padding:14px;
  }
  .pedido-card .codigo{ font-size:2rem; color:var(--coral); font-weight:bold; }
  .pedido-card .cliente{ font-family:-apple-system,sans-serif; font-weight:bold; margin:2px 0 6px; }
  .pedido-card ul{ font-family:-apple-system,sans-serif; font-size:0.82rem; padding-left:18px; margin:0 0 10px; }
  .pedido-card .tag{ font-family:-apple-system,sans-serif; font-size:0.68rem; text-transform:uppercase; letter-spacing:1px; color:var(--teal-dk); background:var(--sage); display:inline-block; padding:2px 7px; border-radius:3px; margin-bottom:6px; }
  .empty{ font-family:-apple-system,sans-serif; color:#7a8f8a; padding:30px; text-align:center; }

  .stats-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:10px; }
  .stat{ background:#fff; border:1px solid var(--line); border-radius:5px; padding:14px; text-align:center; }
  .stat .v{ font-size:1.7rem; color:var(--teal-dk); font-weight:bold; }
  .stat .l{ font-family:-apple-system,sans-serif; font-size:0.68rem; text-transform:uppercase; letter-spacing:1px; color:#5c716b; }

  table.report{ width:100%; border-collapse:collapse; font-family:-apple-system,sans-serif; font-size:0.85rem; }
  table.report th{ text-align:left; background:var(--sage); padding:7px 9px; color:var(--teal-dk); }
  table.report td{ padding:7px 9px; border-bottom:1px solid var(--line); }

  .msg{ font-family:-apple-system,sans-serif; font-size:0.85rem; padding:10px 12px; border-radius:4px; margin-bottom:12px; }
  .msg.ok{ background:#e5f3ea; color:#1f6b3a; border:1px solid #b9dfc6; }
  .msg.err{ background:#fbe9e6; color:#a3341f; border:1px solid #f0b7ab; }

  .home-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .home-tile{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:24px; cursor:pointer; text-align:left; }
  .home-tile:hover{ border-color:var(--teal); }
  .home-tile .t{ font-size:1.15rem; color:var(--teal-dk); margin-bottom:6px; }
  .home-tile .d{ font-family:-apple-system,sans-serif; font-size:0.82rem; color:#5c716b; }

  footer.hint{ font-family:-apple-system,sans-serif; font-size:0.72rem; color:#6d827c; text-align:center; padding:14px; }

  /* Login */
  .login-wrap{ display:flex; justify-content:center; padding: 40px 12px; }
  .login-card{
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:32px;
    max-width:380px; width:100%; box-shadow:0 8px 24px rgba(13,69,58,0.08);
  }
  .login-card .eyebrow{ font-family:-apple-system,sans-serif; font-size:0.68rem; letter-spacing:2px; text-transform:uppercase; color:var(--gold); }
  .login-card h2{ margin:4px 0 20px; color:var(--teal-dk); font-weight:normal; }
  .login-card label{ margin-top:12px; }
  .login-card label:first-of-type{ margin-top:0; }

  /* Usuarios */
  table.users{ width:100%; border-collapse:collapse; font-family:-apple-system,sans-serif; font-size:0.85rem; margin-bottom:20px; }
  table.users th{ text-align:left; background:var(--sage); padding:7px 9px; color:var(--teal-dk); }
  table.users td{ padding:7px 9px; border-bottom:1px solid var(--line); }
  table.users .rol-pill{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.5px; padding:2px 8px; border-radius:10px; background:var(--sage); color:var(--teal-dk); }
  .link-btn{ background:none; border:none; color:var(--teal); cursor:pointer; font-family:-apple-system,sans-serif; font-size:0.8rem; text-decoration:underline; padding:0; margin-right:10px; }
  .link-btn.danger{ color:var(--coral); }

  .perfil-box{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .perfil-avatar{
    width:52px; height:52px; border-radius:50%; background:var(--teal); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-family:-apple-system,sans-serif; font-weight:bold;
  }
</style>
</head>
<body>

<header class="top">
  <div class="toprow">
    <div class="brand">
      <h1>Bazar Ekirayá</h1>
      <span class="eyebrow">Punto de venta</span>
    </div>
    <div id="session-badge"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="app"></main>
<footer class="hint">Los datos de ventas se comparten en tiempo real entre las cajas y la pantalla de despacho.</footer>

<script>
// ⚠️ PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT (termina en /exec)
// Instrucciones completas en Code.gs
const API_URL = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT";

const PRODUCTOS = {
  te: { nombre: 'Té', variantes: null },
  helado: { nombre: 'Helado', variantes: { solo: 'Solo', dos: 'Con 2 toppings', tres: 'Con 3 toppings', full: 'Full (4 toppings)' } },
  nachos: { nombre: 'Nachos', variantes: { solo: 'Solo', dos: 'Con 2 toppings', tres: 'Con 3 toppings', full: 'Full (4 toppings)' } }
};
const ROL_LABEL = { vendedor:'Vendedor', despachador:'Despachador', administrador:'Administrador' };
const ROLE_TABS = {
  vendedor: [['venta','Registrar venta'],['perfil','Mi perfil']],
  despachador: [['despacho','Pantalla de despacho'],['perfil','Mi perfil']],
  administrador: [['home','Inicio'],['venta','Registrar venta'],['despacho','Despacho'],['ventas','Todas las ventas'],['informe','Informe'],['usuarios','Usuarios'],['perfil','Mi perfil']]
};
const ROLE_DEFAULT_VIEW = { vendedor:'venta', despachador:'despacho', administrador:'home' };

let state = {
  view: 'loading',
  currentUser: null,
  loginUsuario: '',
  loginPin: '',
  loginError: null,
  cajaSeleccionada: 1,
  cart: [],
  cliente: '',
  formProducto: 'te',
  formVariante: 'solo',
  formCantidad: 1,
  lastTicket: null,
  data: null,
  msg: null,
  editingUserId: null,
  perfilMsg: null,
  editOrder: null,
  editFormProducto: 'te',
  editFormVariante: 'solo',
  editFormCantidad: 1,
  ventasFiltro: '',
  connError: null,
  saving: false
};

function money(n){ return '$' + Math.round(n).toLocaleString('es-CO'); }

// ---------- Comunicación con el backend (Google Apps Script) ----------
async function apiGet(action, params){
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k, v));
  const res = await fetch(url.toString());
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function apiPost(action, payload){
  // Content-Type text/plain evita el preflight CORS que Apps Script no maneja bien
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...(payload||{}) })
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function loadData(){
  const r = await apiGet('getData');
  if(!r || !r.ok) throw new Error((r && r.error) || 'Respuesta inválida del servidor');
  return r;
}
async function refrescarDatos(){
  try{
    state.data = await loadData();
    state.connError = null;
  }catch(e){
    state.connError = 'No se pudo conectar con la hoja de cálculo. Revisa tu conexión y vuelve a intentar.';
  }
}

function getPrecio(precios, producto, variante){
  if(producto === 'te') return precios.te;
  return precios[producto][variante];
}

function allowedTabsFor(rol){ return ROLE_TABS[rol] || []; }

function render(){
  // guard: si hay usuario logueado pero la vista actual no le pertenece, redirigir
  if(state.currentUser){
    const allowed = allowedTabsFor(state.currentUser.rol).map(t=>t[0]);
    if(!allowed.includes(state.view)){
      state.view = ROLE_DEFAULT_VIEW[state.currentUser.rol];
    }
  } else if(state.view !== 'login' && state.view !== 'loading'){
    state.view = 'login';
  }

  renderSessionBadge();
  renderTabs();
  const app = document.getElementById('app');
  if(state.view === 'loading') app.innerHTML = renderLoading();
  else if(state.view === 'login') app.innerHTML = renderLogin();
  else if(state.view === 'home') app.innerHTML = renderHome();
  else if(state.view === 'venta') app.innerHTML = renderVenta();
  else if(state.view === 'despacho') app.innerHTML = renderDespacho();
  else if(state.view === 'informe') app.innerHTML = renderInforme();
  else if(state.view === 'ventas') app.innerHTML = renderVentas();
  else if(state.view === 'usuarios') app.innerHTML = renderUsuarios();
  else if(state.view === 'perfil') app.innerHTML = renderPerfil();
  attachHandlers();
}

function renderSessionBadge(){
  const el = document.getElementById('session-badge');
  if(!state.currentUser){ el.innerHTML = ''; return; }
  const u = state.currentUser;
  el.innerHTML = `
    <div class="session-badge">
      <div class="who">${u.nombre}</div>
      <div class="rol">${ROL_LABEL[u.rol]}${u.caja ? ' · Caja '+u.caja : ''}</div>
      <button id="btn-logout">Cerrar sesión</button>
    </div>`;
}

function renderTabs(){
  if(!state.currentUser){ document.getElementById('tabs').innerHTML = ''; return; }
  const tabs = allowedTabsFor(state.currentUser.rol);
  document.getElementById('tabs').innerHTML = tabs.map(([k,l]) =>
    `<button data-tab="${k}" class="${state.view===k?'active':''}">${l}</button>`
  ).join('');
}

function renderLoading(){
  if(state.connError){
    return `
    <div class="login-wrap">
      <div class="login-card" style="text-align:center;">
        <div class="eyebrow">Conexión</div>
        <h2 style="font-size:1.1rem;">No se pudo conectar</h2>
        <p class="sans" style="font-size:0.85rem;color:#5c716b;">${state.connError}</p>
        <p class="sans" style="font-size:0.75rem;color:#9fb0ab;">Verifica que API_URL esté bien configurada en el código y que la implementación de Apps Script tenga acceso "Cualquier usuario".</p>
        <button class="btn coral" id="btn-reintentar" style="margin-top:10px;">Reintentar</button>
      </div>
    </div>`;
  }
  return `
  <div class="login-wrap">
    <div class="login-card" style="text-align:center;">
      <div class="eyebrow">Bazar Ekirayá</div>
      <h2 style="font-size:1.1rem;">Conectando con la hoja de cálculo…</h2>
    </div>
  </div>`;
}

function renderLogin(){
  const usuarios = (state.data && state.data.usuarios) ? state.data.usuarios : [];
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="eyebrow">Acceso</div>
      <h2>Inicia sesión</h2>
      ${state.loginError ? `<div class="msg err">${state.loginError}</div>` : ''}
      <label>Usuario</label>
      <select id="login-usuario">
        <option value="">Selecciona tu usuario…</option>
        ${usuarios.map(u=>`<option value="${u.usuario}" ${state.loginUsuario===u.usuario?'selected':''}>${u.nombre} — ${ROL_LABEL[u.rol]}</option>`).join('')}
      </select>
      <label>PIN</label>
      <input type="password" id="login-pin" inputmode="numeric" placeholder="••••" value="${state.loginPin}">
      <div style="margin-top:20px;">
        <button class="btn coral" id="btn-login" style="width:100%;" ${state.saving?'disabled':''}>${state.saving?'Verificando…':'Ingresar'}</button>
      </div>
      <p class="sans" style="font-size:0.75rem;color:#7a8f8a;margin-top:16px;">Cuenta de prueba del administrador: <strong>admin</strong> / PIN <strong>1234</strong></p>
    </div>
  </div>`;
}

function renderHome(){
  return `
  <div class="home-grid">
    <div class="home-tile" data-goto="venta">
      <div class="t">🧾 Registrar venta</div>
      <div class="d">Formulario de caja: elige la caja, el cliente y el pedido (té, helado o nachos con sus toppings). Genera el código de reclamo.</div>
    </div>
    <div class="home-tile" data-goto="despacho">
      <div class="t">📣 Pantalla de despacho</div>
      <div class="d">Muestra a quien entrega los pedidos el código y la descripción de cada venta pendiente.</div>
    </div>
    <div class="home-tile" data-goto="ventas">
      <div class="t">📝 Todas las ventas</div>
      <div class="d">Busca, edita o elimina cualquier venta registrada por cualquiera de las dos cajas.</div>
    </div>
    <div class="home-tile" data-goto="informe">
      <div class="t">📊 Informe de ventas</div>
      <div class="d">Estadísticas en vivo y descarga del informe en Excel con totales por producto y por caja.</div>
    </div>
    <div class="home-tile" data-goto="usuarios">
      <div class="t">👥 Usuarios</div>
      <div class="d">Crea y administra las cuentas de vendedores, despachador y administrador.</div>
    </div>
  </div>`;
}

function variantesHtml(){
  const p = PRODUCTOS[state.formProducto];
  if(!p.variantes) return '';
  const precios = state.data.precios;
  return `
  <div>
    <label>Presentación</label>
    <select id="sel-variante">
      ${Object.entries(p.variantes).map(([k,l]) =>
        `<option value="${k}" ${state.formVariante===k?'selected':''}>${l} — ${money(precios[state.formProducto][k])}</option>`
      ).join('')}
    </select>
  </div>`;
}

function canManageOrder(o){
  const u = state.currentUser;
  if(!u) return false;
  if(u.rol === 'administrador') return true;
  return u.rol === 'vendedor' && o.vendedorId === u.id && o.estado === 'pendiente';
}

function editVariantesHtml(){
  const p = PRODUCTOS[state.editFormProducto];
  if(!p.variantes) return '';
  const precios = state.data.precios;
  return `
  <div>
    <label>Presentación</label>
    <select id="edit-sel-variante">
      ${Object.entries(p.variantes).map(([k,l]) =>
        `<option value="${k}" ${state.editFormVariante===k?'selected':''}>${l} — ${money(precios[state.editFormProducto][k])}</option>`
      ).join('')}
    </select>
  </div>`;
}

function renderEditOrderForm(){
  const eo = state.editOrder;
  const total = eo.items.reduce((s,i)=>s+i.subtotal,0);
  const isAdmin = state.currentUser.rol === 'administrador';
  return `
  ${state.msg ? `<div class="msg ${state.msg.type}">${state.msg.text}</div>` : ''}
  <div class="card">
    <h2>Editar venta #${String(eo.numero).padStart(3,'0')}</h2>
    <div class="row">
      <div>
        <label>Caja</label>
        ${isAdmin ? `
        <div class="caja-choice">
          <input type="radio" id="edit-caja1" name="editcaja" value="1" ${eo.caja==1?'checked':''}>
          <label class="opt" for="edit-caja1">Caja 1</label>

function computeStats(){
  const orders = state.data.orders;
  const totalPedidos = orders.length;
  const ingresoTotal = orders.reduce((s,o)=>s+o.total,0);
  const unidades = orders.reduce((s,o)=>s+o.items.reduce((a,i)=>a+i.cantidad,0),0);
  const porCaja = {1:0,2:0};
  orders.forEach(o=>{ porCaja[o.caja] = (porCaja[o.caja]||0) + o.total; });

  const porProducto = {};
  orders.forEach(o=>o.items.forEach(i=>{
    const key = i.nombre + (i.varianteLabel ? ' — '+i.varianteLabel : '');
    if(!porProducto[key]) porProducto[key] = {cantidad:0, ingresos:0};
    porProducto[key].cantidad += i.cantidad;
    porProducto[key].ingresos += i.subtotal;
  }));

  return { totalPedidos, ingresoTotal, unidades, porCaja, porProducto,
    promedio: totalPedidos ? ingresoTotal/totalPedidos : 0 };
}

function attachHandlers(){
  const btnReintentar = document.getElementById('btn-reintentar');
  if(btnReintentar) btnReintentar.onclick = async ()=>{ await init(); };

  const btnLogout = document.getElementById('btn-logout');
  if(btnLogout) btnLogout.onclick = ()=>{
    state.currentUser = null; state.view = 'login';
    state.loginUsuario=''; state.loginPin=''; state.loginError=null;
    state.cart=[]; state.cliente=''; state.lastTicket=null; state.msg=null;
    render();
  };

  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick = ()=>{ state.view = b.dataset.tab; state.msg=null; state.perfilMsg=null; render(); if(state.view==='despacho'||state.view==='informe') refreshLoop(); };
  });
  document.querySelectorAll('[data-goto]').forEach(b=>{
    b.onclick = ()=>{ state.view = b.dataset.goto; render(); if(state.view==='despacho'||state.view==='informe') refreshLoop(); };
  });

  if(state.view === 'login'){
    const selU = document.getElementById('login-usuario');
    if(selU) selU.onchange = e=>{ state.loginUsuario = e.target.value; };
    const inpPin = document.getElementById('login-pin');
    if(inpPin) inpPin.oninput = e=>{ state.loginPin = e.target.value; };
    const btnLogin = document.getElementById('btn-login');
    if(btnLogin) btnLogin.onclick = hacerLogin;
    if(inpPin) inpPin.addEventListener('keydown', e=>{ if(e.key==='Enter') hacerLogin(); });
  }

  if(state.editOrder){
    const c1 = document.getElementById('edit-caja1'), c2 = document.getElementById('edit-caja2');
    if(c1) c1.onchange = ()=>{ state.editOrder.caja = 1; };
    if(c2) c2.onchange = ()=>{ state.editOrder.caja = 2; };

    const inpCliente = document.getElementById('edit-inp-cliente');
    if(inpCliente) inpCliente.oninput = e=>{ state.editOrder.cliente = e.target.value; };

    const selProd = document.getElementById('edit-sel-producto');
    if(selProd) selProd.onchange = e=>{
      state.editFormProducto = e.target.value;
      const p = PRODUCTOS[state.editFormProducto];
      state.editFormVariante = p.variantes ? Object.keys(p.variantes)[0] : null;
      document.getElementById('edit-variante-wrap').innerHTML = editVariantesHtml();
    };
    const selVar = document.getElementById('edit-sel-variante');
    if(selVar) selVar.onchange = e=>{ state.editFormVariante = e.target.value; };

    const inpCant = document.getElementById('edit-inp-cantidad');
    if(inpCant) inpCant.oninput = e=>{ state.editFormCantidad = Math.max(1, parseInt(e.target.value)||1); };

    const btnAgregar = document.getElementById('edit-btn-agregar');
    if(btnAgregar) btnAgregar.onclick = ()=>{
      const p = PRODUCTOS[state.editFormProducto];
      const precio = getPrecio(state.data.precios, state.editFormProducto, state.editFormVariante);
      const varianteLabel = p.variantes ? p.variantes[state.editFormVariante] : null;
      state.editOrder.items.push({
        producto: state.editFormProducto,
        variante: state.editFormVariante,
        varianteLabel,
        nombre: p.nombre,
        cantidad: state.editFormCantidad,
        precioUnit: precio,
        subtotal: precio * state.editFormCantidad
      });
      state.editFormCantidad = 1;
      render();
    };

    document.querySelectorAll('[data-edit-rm]').forEach(b=>{
      b.onclick = ()=>{ state.editOrder.items.splice(parseInt(b.dataset.editRm),1); render(); };
    });

    const btnGuardarEdicion = document.getElementById('btn-guardar-edicion');
    if(btnGuardarEdicion) btnGuardarEdicion.onclick = guardarEdicionOrden;
    const btnCancelarEdicionOrden = document.getElementById('btn-cancelar-edicion-orden');
    if(btnCancelarEdicionOrden) btnCancelarEdicionOrden.onclick = cancelEditOrder;
  }

  document.querySelectorAll('[data-edit-order]').forEach(b=>{
    b.onclick = ()=>{
      const o = state.data.orders.find(o=>o.id===b.dataset.editOrder);
      if(o) startEditOrder(o);
    };
  });
  document.querySelectorAll('[data-del-order]').forEach(b=>{
    b.onclick = ()=>eliminarOrden(b.dataset.delOrder);
  });

  if(state.view === 'ventas'){
    const inpBuscar = document.getElementById('inp-buscar-venta');
    if(inpBuscar){
      inpBuscar.oninput = e=>{ state.ventasFiltro = e.target.value; render(); };
      // mantener el foco al re-renderizar mientras se escribe
      inpBuscar.focus();
      inpBuscar.selectionStart = inpBuscar.selectionEnd = inpBuscar.value.length;
    }
  }

  if(state.view === 'venta'){
    const c1 = document.getElementById('caja1'), c2 = document.getElementById('caja2');
    if(c1) c1.onchange = ()=>{ state.cajaSeleccionada = 1; };
    if(c2) c2.onchange = ()=>{ state.cajaSeleccionada = 2; };

    const inpCliente = document.getElementById('inp-cliente');
    if(inpCliente) inpCliente.oninput = e=>{ state.cliente = e.target.value; };

    const selProd = document.getElementById('sel-producto');
    if(selProd) selProd.onchange = e=>{
      state.formProducto = e.target.value;
      const p = PRODUCTOS[state.formProducto];
      state.formVariante = p.variantes ? Object.keys(p.variantes)[0] : null;
      document.getElementById('variante-wrap').innerHTML = variantesHtml();
    };
    const selVar = document.getElementById('sel-variante');
    if(selVar) selVar.onchange = e=>{ state.formVariante = e.target.value; };

    const inpCant = document.getElementById('inp-cantidad');
    if(inpCant) inpCant.oninput = e=>{ state.formCantidad = Math.max(1, parseInt(e.target.value)||1); };

    const btnAgregar = document.getElementById('btn-agregar');
    if(btnAgregar) btnAgregar.onclick = ()=>{
      const p = PRODUCTOS[state.formProducto];
      const precio = getPrecio(state.data.precios, state.formProducto, state.formVariante);
      const varianteLabel = p.variantes ? p.variantes[state.formVariante] : null;
      state.cart.push({
        producto: state.formProducto,
        variante: state.formVariante,
        varianteLabel,
        nombre: p.nombre,
        cantidad: state.formCantidad,
        precioUnit: precio,
        subtotal: precio * state.formCantidad
      });
      state.formCantidad = 1;
      render();
    };

    document.querySelectorAll('[data-rm]').forEach(b=>{
      b.onclick = ()=>{ state.cart.splice(parseInt(b.dataset.rm),1); render(); };
    });

    const btnConfirmar = document.getElementById('btn-confirmar');
    if(btnConfirmar) btnConfirmar.onclick = confirmarVenta;

    const btnNueva = document.getElementById('btn-nueva-venta');
    if(btnNueva) btnNueva.onclick = ()=>{
      state.lastTicket = null; state.cart = []; state.cliente=''; state.msg=null; render();
    };
  }

  if(state.view === 'despacho'){
    document.querySelectorAll('[data-entregar]').forEach(b=>{
      b.onclick = ()=>marcarEntregado(b.dataset.entregar);
    });
  }

  if(state.view === 'informe'){
    const btnExcel = document.getElementById('btn-excel');
    if(btnExcel) btnExcel.onclick = descargarExcel;
    const btnGuardar = document.getElementById('btn-guardar-precios');
    if(btnGuardar) btnGuardar.onclick = guardarPrecios;
    const btnReiniciar = document.getElementById('btn-reiniciar');
    if(btnReiniciar) btnReiniciar.onclick = reiniciarDia;
  }

  if(state.view === 'usuarios'){
    document.querySelectorAll('[data-edit-user]').forEach(b=>{
      b.onclick = ()=>{ state.editingUserId = b.dataset.editUser; state.msg=null; render(); };
    });
    document.querySelectorAll('[data-del-user]').forEach(b=>{
      b.onclick = ()=>eliminarUsuario(b.dataset.delUser);
    });
    const btnGuardarU = document.getElementById('btn-guardar-usuario');
    if(btnGuardarU) btnGuardarU.onclick = guardarUsuario;
    const btnCancelar = document.getElementById('btn-cancelar-edicion');
    if(btnCancelar) btnCancelar.onclick = ()=>{ state.editingUserId = null; render(); };
  }

  if(state.view === 'perfil'){
    const btnPin = document.getElementById('btn-cambiar-pin');
    if(btnPin) btnPin.onclick = cambiarPin;
  }
}

async function hacerLogin(){
  if(!state.loginUsuario){ state.loginError = 'Selecciona tu usuario.'; render(); return; }
  state.saving = true; render();
  try{
    state.data = await loadData(); // trae la lista de usuarios más reciente
  }catch(e){
    state.saving = false;
    state.loginError = 'No se pudo conectar con el servidor. Intenta de nuevo.';
    render(); return;
  }
  state.saving = false;
  const u = state.data.usuarios.find(u=>u.usuario === state.loginUsuario);
  if(!u || String(u.pin) !== state.loginPin){
    state.loginError = 'Usuario o PIN incorrecto.';
    render();
    return;
  }
  state.currentUser = u;
  state.loginError = null;
  state.loginPin = '';
  state.view = ROLE_DEFAULT_VIEW[u.rol];
  if(u.rol === 'vendedor' && u.caja) state.cajaSeleccionada = u.caja;
  render();
  if(state.view === 'despacho' || state.view === 'informe') refreshLoop();
}

async function confirmarVenta(){
  if(!state.cliente.trim()){
    state.msg = {type:'err', text:'Escribe el nombre del cliente antes de confirmar.'};
    render();
    return;
  }
  if(!state.cart.length){
    state.msg = {type:'err', text:'Agrega al menos un producto al pedido.'};
    render();
    return;
  }
  state.saving = true; render();
  try{
    const r = await apiPost('addOrder', {
      caja: state.cajaSeleccionada,
      cliente: state.cliente.trim(),
      items: state.cart,
      vendedor: state.currentUser ? state.currentUser.nombre : '—',
      vendedorId: state.currentUser ? state.currentUser.id : null
    });
    if(!r.ok) throw new Error(r.error || 'No se pudo registrar la venta.');
    await refrescarDatos();
    state.lastTicket = r.order;
    state.msg = null;
  }catch(e){
    state.msg = {type:'err', text:'No se pudo guardar la venta (' + e.message + '). Verifica tu conexión e intenta de nuevo.'};
  }
  state.saving = false;
  render();
}

function startEditOrder(order){
  if(!canManageOrder(order)){
    state.msg = {type:'err', text:'No tienes permiso para editar esta venta.'};
    render();
    return;
  }
  state.editOrder = {
    id: order.id,
    numero: order.numero,
    caja: order.caja,
    cliente: order.cliente,
    items: order.items.map(i=>({...i}))
  };
  state.editFormProducto = 'te';
  state.editFormVariante = 'solo';
  state.editFormCantidad = 1;
  state.msg = null;
  render();
}

function cancelEditOrder(){
  state.editOrder = null;
  render();
}

async function guardarEdicionOrden(){
  if(!state.editOrder.cliente.trim()){
    state.msg = {type:'err', text:'El cliente no puede quedar vacío.'};
    render(); return;
  }
  if(!state.editOrder.items.length){
    state.msg = {type:'err', text:'La venta debe tener al menos un producto.'};
    render(); return;
  }
  state.saving = true; render();
  try{
    const r = await apiPost('updateOrder', {
      id: state.editOrder.id,
      caja: state.editOrder.caja,
      cliente: state.editOrder.cliente.trim(),
      items: state.editOrder.items
    });
    if(!r.ok) throw new Error(r.error || 'No se pudo actualizar la venta.');
    await refrescarDatos();
    state.editOrder = null;
    state.msg = {type:'ok', text:'Venta actualizada.'};
  }catch(e){
    state.msg = {type:'err', text: e.message};
  }
  state.saving = false;
  render();
}

async function eliminarOrden(id){
  const o = state.data.orders.find(o=>o.id===id);
  if(!o) return;
  if(!canManageOrder(o)){
    state.msg = {type:'err', text:'No tienes permiso para eliminar esta venta.'};
    render(); return;
  }
  if(!confirm(`¿Eliminar la venta #${String(o.numero).padStart(3,'0')} de ${o.cliente}? Esta acción no se puede deshacer.`)) return;
  try{
    const r = await apiPost('deleteOrder', { id });
    if(!r.ok) throw new Error(r.error || 'No se pudo eliminar la venta.');
    await refrescarDatos();
    state.msg = {type:'ok', text:'Venta eliminada.'};
  }catch(e){
    state.msg = {type:'err', text: e.message};
  }
  render();
}

async function marcarEntregado(id){
  try{
    const r = await apiPost('markDelivered', { id });
    if(!r.ok) throw new Error(r.error || 'No se pudo marcar como entregado.');
    await refrescarDatos();
  }catch(e){
    state.msg = {type:'err', text: e.message};
  }
  render();
}

async function guardarPrecios(){
  const precios = {
    te: parseFloat(document.getElementById('p-te').value)||0,
    helado: {
      solo: parseFloat(document.getElementById('p-helado-solo').value)||0,
      dos: parseFloat(document.getElementById('p-helado-dos').value)||0,
      tres: parseFloat(document.getElementById('p-helado-tres').value)||0,
      full: parseFloat(document.getElementById('p-helado-full').value)||0
    },
    nachos: {
      solo: parseFloat(document.getElementById('p-nachos-solo').value)||0,
      dos: parseFloat(document.getElementById('p-nachos-dos').value)||0,
      tres: parseFloat(document.getElementById('p-nachos-tres').value)||0,
      full: parseFloat(document.getElementById('p-nachos-full').value)||0
    }
  };
  try{
    const r = await apiPost('savePrecios', { precios });
    if(!r.ok) throw new Error(r.error || 'No se pudieron guardar los precios.');
    await refrescarDatos();
    state.msg = {type:'ok', text:'Precios actualizados.'};
  }catch(e){
    state.msg = {type:'err', text: e.message};
  }
  render();
}

async function reiniciarDia(){
  const confirmacion = prompt('Esta acción borrará todas las ventas registradas. Escribe REINICIAR para confirmar:');
  if(confirmacion !== 'REINICIAR') return;
  try{
    const r = await apiPost('resetDay', {});
    if(!r.ok) throw new Error(r.error || 'No se pudo reiniciar el día.');
    await refrescarDatos();
    state.msg = {type:'ok', text:'Las ventas del día se reiniciaron. Los precios y usuarios se conservaron.'};
  }catch(e){
    state.msg = {type:'err', text: e.message};
  }
  render();
}

async function guardarUsuario(){
  const nombre = document.getElementById('u-nombre').value.trim();
  const usuario = document.getElementById('u-usuario').value.trim().toLowerCase();
  const pin = document.getElementById('u-pin').value.trim();
  const rol = document.getElementById('u-rol').value;
  const cajaVal = document.getElementById('u-caja').value;
  const caja = (rol === 'vendedor' && cajaVal) ? parseInt(cajaVal) : null;

  if(!nombre || !usuario || !pin){
    state.msg = {type:'err', text:'Completa nombre, usuario y PIN.'};
    render(); return;
  }

  try{
    const action = state.editingUserId ? 'updateUsuario' : 'addUsuario';
    const payload = state.editingUserId
      ? { id: state.editingUserId, nombre, usuario, pin, rol, caja }
      : { nombre, usuario, pin, rol, caja };
    const r = await apiPost(action, payload);
    if(!r.ok) throw new Error(r.error || 'No se pudo guardar la cuenta.');
    await refrescarDatos();
    if(state.currentUser && state.editingUserId === state.currentUser.id){
      state.currentUser = state.data.usuarios.find(u=>u.id===state.currentUser.id) || state.currentUser;
    }
    state.msg = {type:'ok', text: state.editingUserId ? 'Cuenta actualizada.' : 'Cuenta creada.'};
    state.editingUserId = null;
  }catch(e){
    state.msg = {type:'err', text: e.message};
  }
  render();
}

async function eliminarUsuario(id){
  if(state.currentUser && state.currentUser.id === id){
    state.msg = {type:'err', text:'No puedes eliminar la cuenta con la que iniciaste sesión.'};
    render(); return;
  }
  if(!confirm('¿Eliminar esta cuenta? Esta acción no se puede deshacer.')) return;
  try{
    const r = await apiPost('deleteUsuario', { id });
    if(!r.ok) throw new Error(r.error || 'No se pudo eliminar la cuenta.');
    await refrescarDatos();
    state.msg = {type:'ok', text:'Cuenta eliminada.'};
  }catch(e){
    state.msg = {type:'err', text: e.message};
  }
  render();
}

async function cambiarPin(){
  const actual = document.getElementById('pin-actual').value;
  const nuevo = document.getElementById('pin-nuevo').value;
  const confirmar = document.getElementById('pin-confirmar').value;

  if(String(actual) !== String(state.currentUser.pin)){
    state.perfilMsg = {type:'err', text:'Tu PIN actual no coincide.'};
    render(); return;
  }
  if(!nuevo || nuevo !== confirmar){
    state.perfilMsg = {type:'err', text:'El PIN nuevo y su confirmación no coinciden.'};
    render(); return;
  }
  try{
    const r = await apiPost('updateUsuario', { id: state.currentUser.id, pin: nuevo });
    if(!r.ok) throw new Error(r.error || 'No se pudo actualizar el PIN.');
    await refrescarDatos();
    state.currentUser = state.data.usuarios.find(u=>u.id===state.currentUser.id) || state.currentUser;
    state.perfilMsg = {type:'ok', text:'Tu PIN se actualizó correctamente.'};
  }catch(e){
    state.perfilMsg = {type:'err', text: e.message};
  }
  render();
}

function descargarExcel(){
  const orders = state.data.orders;
  const s = computeStats();

  const detalle = [];
  orders.forEach(o=>{
    o.items.forEach(i=>{
      detalle.push({
        'Código': '#'+String(o.numero).padStart(3,'0'),
        'Caja': o.caja,
        'Vendedor': o.vendedor || '—',
        'Cliente': o.cliente,
        'Hora': o.hora,
        'Producto': i.nombre,
        'Presentación': i.varianteLabel || '—',
        'Cantidad': i.cantidad,
        'Precio unitario': i.precioUnit,
        'Subtotal': i.subtotal,
        'Estado pedido': o.estado === 'entregado' ? 'Entregado' : 'Pendiente'
      });
    });
  });

  const resumenProducto = Object.entries(s.porProducto).map(([k,v])=>({
    'Producto': k, 'Cantidad vendida': v.cantidad, 'Ingresos': v.ingresos
  }));

  const totales = [
    {Indicador:'Total de pedidos', Valor: s.totalPedidos},
    {Indicador:'Unidades vendidas', Valor: s.unidades},
    {Indicador:'Ingreso total', Valor: s.ingresoTotal},
    {Indicador:'Promedio por pedido', Valor: Math.round(s.promedio)},
    {Indicador:'Ingreso caja 1', Valor: s.porCaja[1]||0},
    {Indicador:'Ingreso caja 2', Valor: s.porCaja[2]||0},
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(totales), 'Totales');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumenProducto), 'Resumen por producto');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detalle), 'Detalle de ventas');

  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Informe_Ventas_Bazar_${fecha}.xlsx`);
}

let refreshTimer = null;
function refreshLoop(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(async ()=>{
    if(state.view !== 'despacho' && state.view !== 'informe'){
      clearInterval(refreshTimer); return;
    }
    try{
      state.data = await loadData();
      render();
    }catch(e){ /* si falla un refresco silencioso, se reintenta en el siguiente ciclo */ }
  }, 5000);
}

async function init(){
  await refrescarDatos();
  state.view = state.connError ? 'loading' : 'login';
  render();
}
init();
</script>
